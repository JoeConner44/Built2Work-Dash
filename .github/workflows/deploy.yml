name: Deploy to Netlify

# One subdomain, two folders:
#   dashboard.builttoworkusa.com/staff/    -> index.html (staff) + operations.html
#   dashboard.builttoworkusa.com/customer/ -> customer.html (served as that folder's index.html)
#   dashboard.builttoworkusa.com/          -> redirects to /staff/
# Requires repo secrets: NETLIFY_AUTH_TOKEN, NETLIFY_SITE_ID.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    name: Deploy dashboard site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stage site files
        run: |
          mkdir -p dist/staff dist/customer

          cp index.html operations.html shared.js dist/staff/
          cp -r assets dist/staff/

          cp customer.html dist/customer/index.html
          cp shared.js dist/customer/
          cp -r assets dist/customer/

          printf '/    /staff/   302\n' > dist/_redirects

      - name: Deploy to Netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          npx --yes netlify-cli deploy \
            --dir=dist \
            --site="$NETLIFY_SITE_ID" \
            --auth="$NETLIFY_AUTH_TOKEN" \
            --prod
