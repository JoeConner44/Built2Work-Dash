name: Deploy to Netlify

# One subdomain:
#   dashboard.builttoworkusa.com/          -> index.html (staff) + operations.html
#   dashboard.builttoworkusa.com/staff/    -> same staff bundle, kept as an alias
#   dashboard.builttoworkusa.com/customer/ -> customer.html (served as that folder's index.html)
# The staff bundle is duplicated at the root and under /staff/ (rather than using
# a redirect/rewrite) so relative references in index.html (shared.js, assets/,
# operations.html) resolve correctly from either location.
# Requires repo secrets: NETLIFY_AUTH_TOKEN, NETLIFY_SITE_ID.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    name: Deploy dashboard site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stage site files
        run: |
          mkdir -p dist/staff dist/customer

          cp index.html operations.html shared.js dist/
          cp -r assets dist/

          cp index.html operations.html shared.js dist/staff/
          cp -r assets dist/staff/

          cp customer.html dist/customer/index.html
          cp shared.js dist/customer/
          cp -r assets dist/customer/

      - name: Deploy to Netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          npx --yes netlify-cli@17 deploy \
            --dir=dist \
            --site="built2work-dashboard" \
            --auth="$NETLIFY_AUTH_TOKEN" \
            --prod
